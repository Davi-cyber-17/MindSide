<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Compromissos — MINDSIDE</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body data-area="compromissos">
  <div class="app-shell"><div id="app-shell" style="display:contents;"></div></div>

  <div class="modal-overlay" id="appt-modal-overlay">
    <div class="modal">
      <h3 id="appt-modal-title">Novo compromisso</h3>
      <form id="appt-form">
        <input type="hidden" id="appt-id">
        <div class="field"><label>Título</label><input type="text" id="appt-title" required></div>
        <div class="field"><label>Descrição</label><input type="text" id="appt-description"></div>
        <div class="field"><label>Categoria</label>
          <select id="appt-category"><option value="estudo">Estudo</option><option value="trabalho">Trabalho</option><option value="saude">Saúde</option><option value="lazer">Lazer</option><option value="pessoal">Pessoal</option><option value="geral" selected>Geral</option></select>
        </div>
        <div class="field"><label>Data</label><input type="date" id="appt-date" required></div>
        <div class="form-row">
          <div class="field"><label>Início</label><input type="time" id="appt-start" required></div>
          <div class="field"><label>Fim</label><input type="time" id="appt-end" required></div>
        </div>
        <div id="appt-conflict-warning" class="form-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn" id="appt-cancel-btn">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/area-theme.js"></script>
  <script src="js/slime.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/compromissos.js"></script>
</body>
</html>
