<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Assistente — MINDSIDE</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body data-area="ia">
  <div class="app-shell"><div id="app-shell" style="display:contents;"></div></div>

  <div class="modal-overlay" id="edit-sugg-overlay">
    <div class="modal">
      <h3>Editar sugestão</h3>
      <form id="edit-sugg-form">
        <input type="hidden" id="edit-sugg-id">
        <div class="field"><label>Título</label><input type="text" id="edit-sugg-title" required></div>
        <div class="form-row">
          <div class="field"><label>Tipo</label>
            <select id="edit-sugg-type"><option value="tarefa">Tarefa</option><option value="compromisso">Compromisso</option></select>
          </div>
          <div class="field"><label>Prioridade</label>
            <select id="edit-sugg-priority"><option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Data</label><input type="date" id="edit-sugg-date"></div>
          <div class="field"><label>Horário</label><input type="time" id="edit-sugg-time"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Duração (min)</label><input type="number" id="edit-sugg-duration" value="30"></div>
          <div class="field"><label>Categoria</label>
            <select id="edit-sugg-category"><option value="estudo">Estudo</option><option value="trabalho">Trabalho</option><option value="saude">Saúde</option><option value="lazer">Lazer</option><option value="pessoal">Pessoal</option><option value="geral">Geral</option></select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="edit-sugg-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar edição</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/area-theme.js"></script>
  <script src="js/slime.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/assistente.js"></script>
</body>
</html>
