<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — MINDSIDE</title>
<link rel="icon" type="image/svg+xml" href="assets/stickers/slime-default.svg">
<link rel="stylesheet" href="css/global.css">
</head>
<body data-area="ia">
  <nav class="navbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span> MINDSIDE</a>
    <div class="nav-actions">
      <a class="btn btn-sm btn-ghost" href="dashboard.html">Continuar como Visitante</a>
      <button class="theme-toggle" data-theme-toggle aria-label="Mudar para tema claro"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div style="width:64px;height:52px;margin:0 auto;" data-slime></div>
      <h2>Criar sua conta</h2>
      <p class="sub">Salve suas tarefas, compromissos e metas.</p>
      <div class="form-error" id="form-error"></div>
      <form id="register-form">
        <div class="field">
          <label for="name">Seu nome</label>
          <input type="text" id="name" placeholder="Ex.: Ana Beatriz" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="voce@exemplo.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha (mín. 6 caracteres)</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password_confirm">Confirmar senha</label>
          <input type="password" id="password_confirm" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Criar conta</button>
      </form>
      <div class="switch-link">
        Já tem conta? <a href="login.html">Entrar</a>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/mock-backend.js"></script>
  <script src="js/api.js"></script>
  <script src="js/area-theme.js"></script>
  <script src="js/slime.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
